name: vulkan

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支 / tag'
        required: false
        default: ''
  push:
    branches:
      - "vulkan-ios"

jobs:
  vulkan:
    name: vulkan ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
          - os: ios
            arch: arm64
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
            # The darwin build sandbox only sees a whitelist of paths; the
            # system Xcode (clang + iPhoneOS/MacOSX SDKs) lives under
            # /Applications and must be readable inside the sandbox, otherwise
            # CMake reports the SDK/clang as "does not exist".
            extra-sandbox-paths = /Applications

      - name: Nix version
        run: nix --version

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Xcode path
        id: xcode_path
        run: |
          # Resolve the active Xcode .app path from the selected developer dir
          # (robust against the exact app-bundle name on the runner).
          DEV_DIR=$(xcode-select -p)
          XCODE_PATH=$(dirname "$(dirname "$DEV_DIR")")
          echo "Resolved Xcode: $XCODE_PATH"
          "${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild" -version
          echo "xcode_path=${XCODE_PATH}" >> "$GITHUB_OUTPUT"
          # The nix xcode overlay reads the path from this file (not the env
          # var); without it the build falls back to requiring a pre-registered
          # Xcode.app blob in the Nix store, which CI cannot provide.
          printf '%s\n' "$XCODE_PATH" > .nix/config/xcode.path

      - name: Diagnose Xcode SDKs
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
        run: |
          set +e
          echo "== xcode-select -p =="; xcode-select -p
          echo "== /Applications Xcode bundles =="; ls -1 /Applications | grep -i '^Xcode' || true
          echo "== realpath(selected) =="; realpath "$XCODE_PATH"
          echo "== Platforms =="; ls -1 "$XCODE_PATH/Contents/Developer/Platforms" 2>&1
          echo "== iPhoneOS SDKs =="; ls -1 "$XCODE_PATH/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs" 2>&1
          echo "== MacOSX SDKs =="; ls -1 "$XCODE_PATH/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs" 2>&1
          echo "== toolchain clang =="; ls -l "$XCODE_PATH/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang" 2>&1
          echo "== xcrun iphoneos sdk-path =="; xcrun --sdk iphoneos --show-sdk-path 2>&1
          echo "== xcrun macosx sdk-path =="; xcrun --sdk macosx --show-sdk-path 2>&1
          echo "== xcodebuild -showsdks =="; xcodebuild -showsdks 2>&1
          echo "== nix sandbox conf =="; nix config show 2>/dev/null | grep -iE 'sandbox' || true

      - name: Build vulkan bundle
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
        run: |
          # -L streams every builder's full log. Without it nix prints only the
          # last 25 lines of a failed *dependency*, which hides both the meson
          # diagnostics and the compiler command line.
          nix build -L ".#mk-out-vulkan-${{ matrix.os }}-${{ matrix.arch }}" \
            --out-link "result-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Package
        run: |
          tar -czf "vulkan-bundle-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            -C "result-${{ matrix.os }}-${{ matrix.arch }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: vulkan-bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: vulkan-bundle-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
